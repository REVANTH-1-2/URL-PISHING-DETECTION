<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚠️ Phishing Threat Blocked - DeepShield AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #000000;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .warning-card {
      max-width: 620px;
      width: 100%;
      background: rgba(15, 15, 18, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 0 50px -10px rgba(239, 68, 68, 0.35);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .badge-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .shield-alert {
      font-size: 32px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 12px;
      border-radius: 16px;
      color: #ef4444;
    }

    .header-text h1 {
      font-size: 22px;
      font-weight: 800;
      color: #f87171;
      letter-spacing: -0.5px;
    }

    .header-text p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .url-box {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 14px;
    }

    .label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 6px;
      display: block;
    }

    .target-url {
      font-family: monospace;
      font-size: 13px;
      color: #fca5a5;
      word-break: break-all;
    }

    .risk-meta {
      display: flex;
      gap: 16px;
    }

    .meta-item {
      flex: 1;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .meta-value {
      font-size: 20px;
      font-weight: 800;
      color: #f87171;
    }

    .meta-title {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
    }

    .reasons-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reason-item {
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #18181b;
      border-left: 4px solid #ef4444;
      color: #e2e8f0;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-safe {
      flex: 2;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }

    .btn-safe:hover {
      background: #1d4ed8;
    }

    .btn-unsafe {
      flex: 1;
      background: transparent;
      color: #64748b;
      border: 1px solid #27272a;
      padding: 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-unsafe:hover {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <div class="warning-card">
    <div class="badge-header">
      <div class="shield-alert">🛡️</div>
      <div class="header-text">
        <h1>Phishing Threat Blocked</h1>
        <p>DeepShield AI intercepted this site to protect your credentials & security.</p>
      </div>
    </div>

    <div class="url-box">
      <span class="label">Blocked Risky URL</span>
      <div id="blockedUrl" class="target-url">Loading...</div>
    </div>

    <div class="risk-meta">
      <div class="meta-item">
        <div id="riskScoreVal" class="meta-value">0%</div>
        <div class="meta-title">Risk Score</div>
      </div>
      <div class="meta-item">
        <div id="verdictVal" class="meta-value">PHISHING</div>
        <div class="meta-title">AI Verdict</div>
      </div>
    </div>

    <div>
      <span class="label">Detection Rationale (XAI Explanation)</span>
      <ul id="reasonsList" class="reasons-list">
        <li class="reason-item">Analyzing domain risk indicators...</li>
      </ul>
    </div>

    <div class="actions">
      <button id="btnBack" class="btn-safe">🛡️ Go Back to Safety</button>
      <button id="btnProceed" class="btn-unsafe">Proceed Anyway (Unsafe)</button>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
