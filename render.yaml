services:
  # 1. Backend FastAPI Service
  - type: web
    name: phishing-detection-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: STORE_RAW_INPUT
        value: "false"
      - key: MODEL_PATH
        value: ./ml/saved_models
      - key: PYTHONPATH
        value: ./backend:./ml:.

  # 2. Frontend React / Vite Static Site
  - type: static
    name: phishing-detection-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
